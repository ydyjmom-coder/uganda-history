<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우간다 2027 · 1분 설명 영상</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<style>
  body { margin: 0; background: #1b2530; color: #e8eef4; font-family: system-ui, "Malgun Gothic", sans-serif; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
  canvas { width: min(96vw, 1280px); height: auto; aspect-ratio: 16/9; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  button { background: #1f5fd6; color: #fff; border: 0; border-radius: 6px; padding: 9px 16px; font-size: 15px; cursor: pointer; }
  #status { color: #a5b3c2; font-size: 14px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar"><button id="play">▶ 소리와 함께 재생</button><button id="export">MP4로 저장</button><span id="status">준비 중…</span></div>
<script>
'use strict';
const W = 1920, H = 1080, FPS = 30, SR = 48000; let DUR = 60;
const cv = document.getElementById('c'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
const statusEl = document.getElementById('status');
// 5 colours (BLACK / RED / SILVER / BLUE / GOLD)
const C = { bg: '#051c2c', ink: '#f2f5f8', dim: '#7f93a8', red: '#e0533f', silver: '#a9b6c3', blue: '#4f8bff', gold: '#e3b54a' };
const SERIF = '"Noto Serif KR", serif', SANS = '"Noto Sans KR", sans-serif', MONO = '"IBM Plex Mono", monospace';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eo = x => 1 - Math.pow(1 - clamp(x), 3);
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = x => { x = clamp(x); const c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

const LINES = [
  '2027 우간다 어린이 교육 선교, 무엇이 달라져야 할까요?',
  '우간다 인구의 절반 가까이가 열다섯 살 미만입니다. 세계에서 가장 젊은 나라 중 하나죠.',
  'AI 워크숍은 이제 누구나 합니다. 우리는 인터넷 없이도 쓰는 AI 교안과 현장 코칭으로 교사를 세웁니다.',
  '네 개의 기둥을 세웁니다. 매주 어린이 예배, 방학마다 성경캠프, 52주 성경교육, 그리고 교사교육.',
  '단기선교팀은 주연이 아니라 조연입니다. 현지 교사가 이끌고, 단기팀은 돕고, 떠난 뒤에도 사역이 이어집니다.',
  '캠프는 세 번 엽니다. 5월 시범, 8월 단기팀 연합, 12월에는 현지 교사만으로 엽니다.',
  '2027년은 1분기 준비, 2분기 교사 훈련, 3분기 연합 캠프와 확장, 4분기 자립과 인증입니다.',
  '가격은 씨앗, 성장, 파트너십 세 단계. 목표는 교사 삼백 명, 어린이 만 이천 명입니다.',
  '행사보다 사람을, 한 번의 감동보다 지속되는 변화를. 2027 우간다 어린이 교육 선교 로드맵입니다.'];
let VO = [];   // [{buf, off, len, start}]
let SC = [];   // scene start times

// ---------- line-art primitives ----------
function plen(p) { let L = 0; for (let i = 1; i < p.length; i++) L += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return L; }
function stroke(p, k, col, w = 4) { k = clamp(k); if (k <= 0) return; const tot = plen(p) * k; let acc = 0;
  g.save(); g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(p[0][0], p[0][1]);
  for (let i = 1; i < p.length; i++) { const d = Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
    if (acc + d >= tot) { const r = (tot - acc) / d; g.lineTo(p[i - 1][0] + (p[i][0] - p[i - 1][0]) * r, p[i - 1][1] + (p[i][1] - p[i - 1][1]) * r); break; }
    g.lineTo(p[i][0], p[i][1]); acc += d; }
  g.stroke(); g.restore(); }
const circ = (cx, cy, r, a0 = -Math.PI / 2, n = 48) => [...Array(n + 1)].map((_, i) => [cx + Math.cos(a0 + i / n * Math.PI * 2) * r, cy + Math.sin(a0 + i / n * Math.PI * 2) * r]);
function figure(x, y, s, k, col, w = 4) { // simple line person; y = feet
  const h = 120 * s; stroke(circ(x, y - h, 16 * s), k * 2, col, w);
  stroke([[x, y - h + 16 * s], [x, y - h * .38]], k * 2 - .5, col, w);
  stroke([[x - 26 * s, y - h * .62], [x, y - h * .72], [x + 26 * s, y - h * .62]], k * 2 - .8, col, w);
  stroke([[x - 18 * s, y], [x, y - h * .38], [x + 18 * s, y]], k * 2 - 1, col, w); }
function text(str, x, y, size, col, o = {}) { g.save(); g.font = `${o.weight || 700} ${size}px ${o.font || SANS}`; g.fillStyle = col; g.textAlign = o.align || 'left'; g.textBaseline = 'alphabetic';
  g.globalAlpha = o.alpha ?? 1; if (o.ls && 'letterSpacing' in g) g.letterSpacing = o.ls; g.fillText(str, x, y); g.restore(); }
// kinetic: characters rise in one by one
function kinetic(str, x, y, size, col, t, o = {}) { const st = o.stagger ?? .035, font = `${o.weight || 900} ${size}px ${o.font || SANS}`;
  g.save(); g.font = font; const chars = [...str]; const ws = chars.map(c => g.measureText(c).width); const tot = ws.reduce((a, b) => a + b, 0);
  let cx = o.align === 'center' ? x - tot / 2 : o.align === 'right' ? x - tot : x;
  chars.forEach((c, i) => { const k = clamp((t - i * st) / .45); if (k > 0) { g.globalAlpha = eo(k) * (o.alpha ?? 1); g.fillStyle = col; g.fillText(c, cx, y + (1 - back(k)) * size * .6); } cx += ws[i]; });
  g.restore(); return tot; }
function out(t, t1, d = .4) { return 1 - clamp((t - t1) / d); }
function counter(v, t, dur = 1.2) { return v * eo(t / dur); }

// ---------- scenes ----------
function sceneTitle(t, end) {
  const a = out(t, end - .4);
  g.save(); g.globalAlpha = a;
  stroke([[160, 760], [1760, 760]], t / 1.2, C.silver, 3);
  stroke(circ(1500, 760, 150, Math.PI, 48).slice(0, 25), (t - .5) / 1.2, C.gold, 5);
  for (let i = 0; i < 7; i++) { const ang = Math.PI + (i + 1) / 8 * Math.PI; stroke([[1500 + Math.cos(ang) * 180, 760 + Math.sin(ang) * 180], [1500 + Math.cos(ang) * 230, 760 + Math.sin(ang) * 230]], (t - 1.2 - i * .08) / .4, C.gold, 4); }
  kinetic('2027', 160, 600, 300, C.ink, t - .2, { font: SERIF, stagger: .12 });
  kinetic('우간다 어린이 교육 선교', 170, 700, 64, C.blue, t - .9, { stagger: .04, weight: 700 });
  kinetic('무엇이 달라져야 할까요?', 170, 880, 54, C.ink, t - 2.0, { stagger: .04, weight: 500 });
  g.restore(); }
function sceneYouth(t, end) {
  const a = out(t, end - .4); g.save(); g.globalAlpha = a;
  const v = counter(46.6, t - .3, 1.6);
  text(v.toFixed(1), 160, 520, 260, C.ink, { font: SERIF, weight: 900 }); g.save(); g.font = `900 260px ${SERIF}`; const pw = g.measureText('46.6').width; g.restore(); text('%', 180 + pw, 520, 120, C.blue, { font: SERIF });
  kinetic('15세 미만 인구 비중', 170, 610, 54, C.blue, t - .6, { weight: 700 });
  kinetic('세계에서 가장 젊은 나라 중 하나', 170, 690, 40, C.silver, t - 2.6, { weight: 500 });
  for (let i = 0; i < 10; i++) { const x = 1000 + i * 82, col = i < 5 ? C.gold : C.dim; figure(x, 820 - (i < 5 ? 0 : 0), i < 5 ? .95 : .95, (t - .8 - i * .12) / .8, col, 4); }
  stroke([[960, 830], [1800, 830]], (t - .4) / 1, C.silver, 2);
  text('10명 중 약 5명', 1000, 900, 34, C.gold, { alpha: eo((t - 2.4) / .5) });
  text('출처: CIA World Factbook 2024 추정', 160, 960, 22, C.dim, { weight: 400, alpha: eo((t - 1) / .5) });
  g.restore(); }
function sceneTeacher(t, end) {
  const a = out(t, end - .4); g.save(); g.globalAlpha = a;
  // AI workshop differentiation: generic "AI 워크숍" crossed out, offline laptop line art, three differentiators
  kinetic('AI 워크숍', 160, 300, 110, C.dim, t - .1, { font: SERIF });
  text('누구나 합니다', 760, 300, 54, C.dim, { weight: 500, alpha: eo((t - .8) / .4) });
  stroke([[150, 262], [1120, 262]], (t - 1.5) / .5, C.red, 8);
  // laptop
  stroke([[1260, 640], [1260, 420], [1640, 420], [1640, 640], [1260, 640]], (t - .4) / 1.2, C.silver, 4);
  stroke([[1200, 640], [1700, 640], [1660, 700], [1240, 700], [1200, 640]], (t - 1.2) / .8, C.silver, 4);
  // no-wifi arcs
  [60, 100, 140].forEach((r, i) => { const arc = [...Array(25)].map((_, k) => { const a = Math.PI * (1.25 + k / 24 * .5); return [1450 + Math.cos(a) * r, 590 + Math.sin(a) * r]; }); stroke(arc, (t - 1.6 - i * .15) / .4, C.blue, 5); });
  stroke([[1360, 460], [1540, 600]], (t - 2.3) / .3, C.red, 6);
  text('오프라인', 1450, 760, 34, C.blue, { align: 'center', weight: 700, alpha: eo((t - 2.4) / .4) });
  [['오프라인 AI 교안', C.blue], ['교실 현장 코칭', C.gold], ['교사가 교사를 세움', C.ink]].forEach(([s, col], i) => {
    stroke([[160, 430 + i * 130], [200, 430 + i * 130]], (t - 2.4 - i * .7) / .3, col, 8);
    kinetic(s, 230, 450 + i * 130, 66, col, t - 2.5 - i * .7, { weight: 900 }); });
  g.restore(); }
function scenePillars(t, end) {
  const a = out(t, end - .4); g.save(); g.globalAlpha = a;
  kinetic('네 개의 기둥', 160, 200, 80, C.ink, t - .1, { font: SERIF });
  const P = [['어린이 예배', '매주', C.blue], ['성경캠프', '방학마다', C.gold], ['성경교육', '52주', C.silver], ['교사교육', '모든 것을 받침', C.red]];
  stroke([[160, 300], [1760, 300]], (t - .3) / 1, C.silver, 6);
  stroke([[160, 920], [1760, 920]], (t - .3) / 1, C.silver, 6);
  P.forEach(([n, s, col], i) => { const x = 330 + i * 420, st = .8 + i * 1.3;
    stroke([[x - 165, 920], [x - 165, 320]], (t - st) / .7, col, 6); stroke([[x + 165, 920], [x + 165, 320]], (t - st - .1) / .7, col, 6);
    kinetic(n, x, 640, 52, C.ink, t - st - .4, { align: 'center', weight: 900 });
    text(s, x, 710, 32, col, { align: 'center', weight: 500, alpha: eo((t - st - .8) / .4) }); });
  g.restore(); }
function sceneSTM(t, end) {
  const a = out(t, end - .4); g.save(); g.globalAlpha = a;
  kinetic('단기선교팀', 160, 260, 70, C.ink, t - .1, { font: SERIF });
  // 주연 crossed → 조연
  text('주연', 160, 470, 180, C.dim, { font: SERIF, weight: 900, alpha: eo((t - .4) / .3) });
  stroke([[150, 420], [540, 420]], (t - 1.2) / .4, C.red, 12);
  kinetic('조연', 600, 470, 180, C.blue, t - 1.6, { font: SERIF, stagger: .15 });
  // plane arc
  const arc = [...Array(41)].map((_, i) => { const u = i / 40; return [1050 + u * 700, 520 - Math.sin(u * Math.PI) * 260]; });
  stroke(arc, (t - .5) / 1.6, C.silver, 3);
  [['현지 교사가 이끌고', C.gold], ['단기팀은 돕고', C.blue], ['떠난 뒤에도 이어진다', C.ink]].forEach(([s, col], i) => kinetic(s, 160, 680 + i * 100, 58, col, t - 2.6 - i * 1.2, { weight: 700 }));
  figure(1500, 920, 1.3, (t - 2.6) / .8, C.gold, 6); figure(1650, 920, .95, (t - 3.8) / .8, C.blue, 4);
  g.restore(); }
function sceneCamps(t, end) {
  const a = out(t, end - .4); g.save(); g.globalAlpha = a;
  kinetic('성경캠프 3회', 160, 220, 80, C.ink, t - .1, { font: SERIF });
  const L = 220, R = 1700; stroke([[L, 600], [R, 600]], (t - .3) / 1.2, C.silver, 4);
  for (let m = 0; m < 12; m++) { const x = L + (R - L) * (m + .5) / 12; stroke([[x, 590], [x, 610]], (t - .5 - m * .05) / .2, C.dim, 3); text(`${m + 1}월`, x, 650, 24, C.dim, { align: 'center', weight: 500, alpha: eo((t - .6 - m * .05) / .3) }); }
  [[4, '5월', '시범 캠프', C.silver, 1.6], [7, '8월', '단기팀 연합 캠프', C.blue, 2.8], [11, '12월', '현지 교사 단독 캠프', C.gold, 4.2]].forEach(([m, mm, lab, col, st]) => {
    const x = L + (R - L) * (m + .5) / 12, k = back((t - st) / .5);
    if (t > st) { g.save(); g.fillStyle = col; g.beginPath(); g.arc(x, 600, 22 * k, 0, 7); g.fill(); g.restore();
      stroke([[x, 578], [x, 400]], (t - st) / .5, col, 3);
      kinetic(mm, x, 380, 54, col, t - st - .2, { align: 'center', weight: 900 });
      kinetic(lab, x, 760, 40, C.ink, t - st - .4, { align: 'center', weight: 700 }); } });
  text('우간다 학교 방학 기준 · 8월은 한국 여름방학과 겹침', 220, 960, 28, C.dim, { weight: 400, alpha: eo((t - 5) / .5) });
  g.restore(); }
function sceneRoadmap(t, end) {
  const a = out(t, end - .4); g.save(); g.globalAlpha = a;
  kinetic('2027 로드맵', 160, 220, 80, C.ink, t - .1, { font: SERIF });
  const Q = [['Q1', '준비', C.silver], ['Q2', '교사 훈련', C.red], ['Q3', '연합 캠프·확장', C.blue], ['Q4', '자립 캠프·인증', C.gold]];
  stroke([[200, 560], [1720, 560]], (t - .3) / 1.5, C.silver, 4);
  Q.forEach(([q, s, col], i) => { const x = 300 + i * 440, st = .9 + i * 1.3, k = back((t - st) / .5);
    if (t > st) { g.save(); g.strokeStyle = col; g.lineWidth = 6; g.fillStyle = C.bg; g.beginPath(); g.arc(x, 560, 34 * k, 0, 7); g.fill(); g.stroke(); g.restore(); }
    kinetic(q, x, 470, 64, col, t - st, { align: 'center', font: MONO, weight: 500 });
    kinetic(s, x, 680, 46, C.ink, t - st - .3, { align: 'center', weight: 700 }); });
  g.restore(); }
function sceneKPI(t, end) {
  const a = out(t, end - .4); g.save(); g.globalAlpha = a;
  kinetic('가격 세 단계', 160, 210, 72, C.ink, t - .1, { font: SERIF });
  const P = [['씨앗', '$1,200', '1일 워크숍', C.silver], ['성장', '$6,500', '3개월 · 코칭 6회', C.blue], ['파트너십', '$18,000', '12개월 · 트레이너 인증', C.gold]];
  P.forEach(([n, p, d, col], i) => { const x = 160 + i * 560, st = .4 + i * .6;
    stroke([[x, 280], [x + 500, 280], [x + 500, 560], [x, 560], [x, 280]], (t - st) / .9, col, i === 1 ? 6 : 3);
    kinetic(n, x + 30, 350, 44, col, t - st - .3, { weight: 700 });
    kinetic(p, x + 30, 470, 96, C.ink, t - st - .5, { font: SERIF, stagger: .05 });
    text(d, x + 30, 530, 30, C.dim, { weight: 500, alpha: eo((t - st - .9) / .4) }); });
  const K = [[300, '훈련 교사 (명)', C.red], [12000, '어린이 (명)', C.blue]];
  K.forEach(([v, lab, col], i) => { const x = 160 + i * 700, st = 3.4 + i * .6;
    stroke([[x, 640], [x + 560, 640]], (t - st) / .4, col, 6);
    if (t > st) text(Math.round(counter(v, t - st, 1)).toLocaleString('ko-KR'), x, 790, 130, C.ink, { font: SERIF, weight: 900 });
    kinetic(lab, x, 870, 40, col, t - st - .3, { weight: 700 }); });
  g.restore(); }
function sceneEnd(t, end) {
  const a = out(t, end - .3, .3); g.save(); g.globalAlpha = a;
  kinetic('행사보다 사람을,', 960, 380, 100, C.ink, t - .1, { align: 'center', font: SERIF });
  kinetic('감동보다 지속되는 변화를.', 960, 520, 100, C.gold, t - 1.4, { align: 'center', font: SERIF });
  stroke([[560, 620], [1360, 620]], (t - 2.6) / .8, C.silver, 3);
  kinetic('2027 우간다 어린이 교육 선교 로드맵', 960, 720, 52, C.ink, t - 3.0, { align: 'center', weight: 700 });
  const bars = [C.ink, C.red, C.silver, C.blue, C.gold]; bars.forEach((c, i) => { const k = eo((t - 3.6 - i * .12) / .4); g.save(); g.fillStyle = c; g.fillRect(760 + i * 84, 790, 70 * k, 10); g.restore(); });
  text('BLACK · RED · SILVER · BLUE · GOLD', 960, 850, 22, C.dim, { align: 'center', weight: 500, alpha: eo((t - 4.2) / .4), font: MONO });
  g.restore(); }
const SCENES = [sceneTitle, sceneYouth, sceneTeacher, scenePillars, sceneSTM, sceneCamps, sceneRoadmap, sceneKPI, sceneEnd];

function render(t) {
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  // faint grid (consulting chart paper)
  g.strokeStyle = 'rgba(255,255,255,.035)'; g.lineWidth = 1; for (let x = 0; x < W; x += 80) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); } for (let y = 0; y < H; y += 80) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  let si = 0; for (let i = 0; i < SC.length; i++) if (t >= SC[i]) si = i;
  const end = si + 1 < SC.length ? SC[si + 1] : DUR;
  SCENES[si](t - SC[si], end - SC[si]);
  // header + progress + caption
  text('UGANDA 2027 · 어린이 교육 선교 전략', 80, 70, 22, C.dim, { font: MONO, weight: 500 });
  text(`${String(si + 1).padStart(2, '0')} / 09`, W - 80, 70, 22, C.dim, { font: MONO, weight: 500, align: 'right' });
  g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(80, 92, W - 160, 2); g.fillStyle = [C.ink, C.red, C.silver, C.blue, C.gold][si % 5]; g.fillRect(80, 92, (W - 160) * clamp(t / DUR), 2);
  const v = VO.find(v => t >= v.start - .1 && t <= v.start + v.len + .3);
  if (v) { const idx = VO.indexOf(v); g.save(); g.font = `500 30px ${SANS}`; const tw = Math.min(W - 200, g.measureText(LINES[idx]).width);
    g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(960 - tw / 2 - 24, 1000, tw + 48, 50); g.fillStyle = '#ffffff'; g.textAlign = 'center'; g.fillText(LINES[idx], 960, 1036, W - 200); g.restore(); }
  g.restore();
}

// ---------- audio: narration + soft pad ----------
let audioBuf = null;
async function buildAudio() {
  // measure clips first
  const tmp = new OfflineAudioContext(1, SR, SR);
  const clips = [];
  for (let i = 1; i <= 9; i++) { const buf = await tmp.decodeAudioData(await (await fetch(`voice/k${String(i).padStart(2, '0')}.wav`)).arrayBuffer());
    const d = buf.getChannelData(0); let s0 = 0, s1 = d.length - 1; while (s0 < d.length && Math.abs(d[s0]) < .01) s0++; while (s1 > s0 && Math.abs(d[s1]) < .01) s1--;
    clips.push({ buf, off: Math.max(0, s0 / SR - .03), len: (s1 - s0) / SR + .1 }); }
  const total = clips.reduce((a, c) => a + c.len, 0); const gap = clamp((58.6 - .6 - total) / 8, .2, .9);
  let tt = .6; VO = clips.map(c => { const v = { ...c, start: tt }; tt += c.len + gap; return v; });
  DUR = Math.max(60, Math.ceil(tt + 1.2)); SC = VO.map((v, i) => i === 0 ? 0 : v.start - .35);
  const ac = new OfflineAudioContext(2, SR * DUR, SR);
  const master = ac.createGain(); master.gain.value = .9; const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; master.connect(comp); comp.connect(ac.destination);
  master.gain.setValueAtTime(.9, DUR - 1.5); master.gain.linearRampToValueAtTime(0, DUR - .05);
  const music = ac.createGain(); music.gain.value = .32; music.connect(master);
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800; lp.connect(music);
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const pad = (t, d, m, v) => { for (const det of [-6, 6]) { const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = det; const ga = ac.createGain();
    ga.gain.setValueAtTime(0, t); ga.gain.linearRampToValueAtTime(v, t + 1.2); ga.gain.setValueAtTime(v, t + d - 1); ga.gain.linearRampToValueAtTime(0, t + d + .4); o.connect(ga); ga.connect(lp); o.start(t); o.stop(t + d + .5); } };
  const pluck = (t, m, v) => { const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = mtof(m); const ga = ac.createGain(); ga.gain.setValueAtTime(0, t); ga.gain.linearRampToValueAtTime(v, t + .005); ga.gain.exponentialRampToValueAtTime(.0001, t + 1.2); o.connect(ga); ga.connect(music); o.start(t); o.stop(t + 1.3); };
  const prog = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]]; // Am F C G
  for (let b = 0; b * 4 < DUR; b++) { const t0 = b * 4, ch = prog[b % 4]; ch.forEach(m => pad(t0, 4, m, .028)); pad(t0, 4, ch[0] - 12, .03);
    for (let k = 0; k < 8; k++) pluck(t0 + k * .5, ch[k % 3] + 12 + (k === 7 ? 7 : 0), .05); }
  const voBus = ac.createGain(); voBus.gain.value = 1.6; const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 100; voBus.connect(hp); hp.connect(master);
  for (const v of VO) { const s = ac.createBufferSource(); s.buffer = v.buf; s.connect(voBus); s.start(v.start, v.off, v.len);
    music.gain.setTargetAtTime(.16, v.start - .15, .08); music.gain.setTargetAtTime(.32, v.start + v.len + .05, .3); }
  const buf = await ac.startRendering();
  let pk = 0; for (let c = 0; c < 2; c++) for (const x of buf.getChannelData(c)) pk = Math.max(pk, Math.abs(x));
  if (pk > .95) for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= .95 / pk; }
  return buf;
}

// ---------- playback & export ----------
let ready = false, exporting = false, actx = null, src = null, startAt = 0, clock0 = performance.now();

  src = actx.createBufferSource(); src.buffer = audioBuf; src.loop = true; src.connect(actx.destination); startAt = actx.currentTime + .05; src.start(startAt); };

    let vcfg = null; for (const codec of ['avc1.640028', 'avc1.4d0028', 'avc1.42002a']) { const c = { codec, width: W, height: H, bitrate: 10e6, framerate: FPS, avc: { format: 'avc' } };

    for (let i = 0; i < L.length; i += 1024) { const n = Math.min(1024, L.length - i), d = new Float32Array(n * 2); d.set(L.subarray(i, i + n), 0); d.set(R.subarray(i, i + n), n);
      const ad = new AudioData({ format: 'f32-planar', sampleRate: SR, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(i / SR * 1e6), data: d }); aenc.encode(ad); ad.close(); }

      venc.encode(vf, { keyFrame: i % 60 === 0 }); vf.close(); while (venc.encodeQueueSize > 6) await new Promise(r => setTimeout(r, 5));

    await venc.flush(); muxer.finalize(); const blob = new Blob([muxer.target.buffer], { type: 'video/mp4' });
    if (opts.upload) { const r = await fetch('/upload?name=' + opts.upload, { method: 'POST', body: blob }); window.__up = r.status; }
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'uganda_2027_1min.mp4'; a.click(); }
    statusEl.textContent = `저장 완료 (${(blob.size / 1048576).toFixed(1)}MB)`; window.__export = { state: 'done', size: blob.size, dur: DUR };
  } catch (e) { console.error(e); statusEl.textContent = '내보내기 실패: ' + e.message; window.__export = { state: 'error', msg: String(e) }; }

}
